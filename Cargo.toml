[package]
name = "twenty-two-factor-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Evidence-first audits for repositories and GitHub organizations against the Twenty-Two-Factor App"
license = "MIT"
repository = "https://github.com/22-factor-apps/22-factor-apps-audit"
homepage = "https://22-factor-apps.github.io/audit"
readme = "README.md"
keywords = ["architecture", "audit", "cli", "devops", "evidence"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "twenty-two"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ureq = { version = "3.4.0", features = ["json"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
